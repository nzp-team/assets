name: Asset Assembly
on:
  push:
    branches: [main]
jobs:
  discover-maps:
    name: Discover Maps
    runs-on: ubuntu-latest
    outputs:
      maps: ${{ steps.maps.outputs.maps }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List Maps
        id: maps
        run: |
          maps=$(find source/maps -type f -name '*.map' | awk -F/ 'NF == 4 && $4 == $3 ".map" { print $3 }' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')
          test "$maps" != '[]' && echo "maps=$maps" >> "$GITHUB_OUTPUT"

  map-build:
    name: Compile ${{ matrix.map }}
    needs: discover-maps
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    strategy:
      fail-fast: false
      matrix:
        map: ${{ fromJSON(needs.discover-maps.outputs.maps) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select assets push commit
        env:
          ASSETS_SHA: ${{ github.sha }}
        run: |
          git -C /workspace/repos/assets fetch origin main
          git -C /workspace/repos/assets checkout --detach "$ASSETS_SHA"
          echo "Assets commit: $(git -C /workspace/repos/assets rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile map
        env:
          MAP: ${{ matrix.map }}
        run: /entrypoint.sh build-map --map "$MAP" --full
      - name: Upload compiled map
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.map }}
          path: |
            /workspace/repos/assets/common/maps/${{ matrix.map }}.bsp
            /workspace/repos/assets/common/maps/${{ matrix.map }}.nsz
          if-no-files-found: error

  Build:
    needs: [discover-maps, map-build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select assets push commit
        env:
          ASSETS_SHA: ${{ github.sha }}
        run: |
          git -C /workspace/repos/assets fetch origin main
          git -C /workspace/repos/assets checkout --detach "$ASSETS_SHA"
          echo "Assets commit: $(git -C /workspace/repos/assets rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Download compiled maps
        uses: actions/download-artifact@v4
        with:
          pattern: map-*
          path: /workspace/repos/assets/common/maps
          merge-multiple: true
      - name: Verify compiled maps
        env:
          MAPS: ${{ needs.discover-maps.outputs.maps }}
        run: |
          jq -r '.[]' <<< "$MAPS" | while IFS= read -r map; do
            test -s "/workspace/repos/assets/common/maps/$map.bsp"
          done
      - name: Build archives
        run: |
          /entrypoint.sh build-wads
          /entrypoint.sh build-assets
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assembled-assets
          path: /workspace/repos/assets/tmp/*.zip
          if-no-files-found: error
  Release:
    needs: [Build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ubuntu:24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: assembled-assets
          path: ./tmp
      - name: Generate Build Date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d-%H-%M-%S')"
      - name: Delete Old Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          delete_release: true
          tag_name: newest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: newest
          release_name: Automated Release ${{ steps.date.outputs.date }}
          body: |
            These are the latest versions of NZ:P's game asset data. This does **not** include the game itself or the QuakeC. If you do not know what you are doing, you may want/need to be [here](https://github.com/nzp-team/nzportable) instead.

            <details>
              <summary>Changed files (ignore)</summary>

              ```
              ${{ steps.files.outputs.added_modified }}
              ```

            </details>

            To install:
            - Grab the `.ZIP` archive for your desired platform below (*-nzp-assets.zip)
            - Extract the contents of the `.ZIP` archive to the required locations.
              - NX: `/switch/`
              - PC: Anywhere, or where your `nzportable.exe` from an existing install is.
              - PSP: `/PSP/GAME/`
              - VITA: `/ux0:` (archive contains a `data` folder).
              - 3DS: `/3ds/`
          draft: true
          prerelease: false
      - name: Upload NX Data
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/nx-nzp-assets.zip
          asset_name: nx-nzp-assets.zip
          asset_content_type: application/zip
      - name: Upload PC Data
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/pc-nzp-assets.zip
          asset_name: pc-nzp-assets.zip
          asset_content_type: application/zip
      - name: Upload PSP Data
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/psp-nzp-assets.zip
          asset_name: psp-nzp-assets.zip
          asset_content_type: application/zip
      - name: Upload VITA Data
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/vita-nzp-assets.zip
          asset_name: vita-nzp-assets.zip
          asset_content_type: application/zip
      - name: Upload 3DS Data
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/3ds-nzp-assets.zip
          asset_name: 3ds-nzp-assets.zip
          asset_content_type: application/zip
      - name: Upload TNS Data
        uses: actions/upload-release-asset@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/nspire-nzp-assets.zip
          asset_name: nspire-nzp-assets.zip
          asset_content_type: application/zip
      - name: Upload Texture WAD Archive
        uses: actions/upload-release-asset@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tmp/texture-wads.zip
          asset_name: texture-wads.zip
          asset_content_type: application/zip       
      - name: Publish Release
        uses: StuYarrow/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
