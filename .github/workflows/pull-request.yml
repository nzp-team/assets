name: Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  resolve-toolbox:
    name: Pull Toolbox
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve Toolbox Image
        id: image
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          toolbox_image=$(sed -nE 's/^[[:space:]]*toolbox_image=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          if [ -n "$toolbox_image" ]; then
            if [[ ! "$toolbox_image" =~ ^ghcr\.io/[A-Za-z0-9-]+/toolbox(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]]; then
              echo "Invalid Toolbox image: $toolbox_image" >&2
              exit 1
            fi
            image="$toolbox_image"
          else
            image='ghcr.io/nzp-team/toolbox:main'
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Toolbox Image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  resolve-refs:
    name: Resolve Dependency Refs
    runs-on: ubuntu-latest
    outputs:
      quakec_ref: ${{ steps.refs.outputs.quakec_ref }}
      vril_ref: ${{ steps.refs.outputs.vril_ref }}
    steps:
      - name: Read dependency refs
        id: refs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          quakec_ref=$(sed -nE 's/^[[:space:]]*quakec_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          vril_ref=$(sed -nE 's/^[[:space:]]*vril_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          {
            echo "quakec_ref=$quakec_ref"
            echo "vril_ref=$vril_ref"
          } >> "$GITHUB_OUTPUT"

  discover-maps:
    name: Discover Maps
    runs-on: ubuntu-latest
    outputs:
      maps: ${{ steps.maps.outputs.maps }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: List Maps
        id: maps
        env:
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          maps=$(find source/maps -type f -name '*.map' | awk -F/ 'NF == 4 && $4 == $3 ".map" { print $3 }' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')
          test "$maps" != '[]' && echo "maps=$maps" >> "$GITHUB_OUTPUT"

  assets-tests:
    name: ${{ matrix.name }}
    needs: [resolve-toolbox, resolve-refs]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    strategy:
      matrix:
        include:
          - name: Verify .MAP files conform
            test: map_validator
          - name: Verify referenced map assets exist
            test: map_assets_exist
          - name: Verify WAD textures conform
            test: wad_texture_conformity
          - name: Verify MDL models conform
            test: mdl_validator
          - name: Verify WAV sounds conform
            test: wav_validator
          - name: Verify PCX textures conform
            test: pcx_validator
          - name: Validate waypoint paths
            test: pathfind
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select assets PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/assets fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/assets checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/assets rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/assets rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          {
            echo "Assets PR head: \`$PR_HEAD_SHA\`"
            echo "Tested merge commit: \`$PR_MERGE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Select dependency overrides
        if: needs.resolve-refs.outputs.quakec_ref != '' || needs.resolve-refs.outputs.vril_ref != ''
        env:
          QUAKEC_REF: ${{ needs.resolve-refs.outputs.quakec_ref }}
          VRIL_REF: ${{ needs.resolve-refs.outputs.vril_ref }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          set -euo pipefail
          for dependency in quakec vril; do
            case "$dependency" in
              quakec) repository=quakec; ref="$QUAKEC_REF" ;;
              vril) repository=vril-engine; ref="$VRIL_REF" ;;
            esac
            [ -n "$ref" ] || continue
            directory="/workspace/repos/$repository"
            git -C "$directory" fetch "https://github.com/${PR_HEAD_OWNER}/${repository}.git" "$ref"
            git -C "$directory" checkout --detach FETCH_HEAD
            echo "${repository} override: \`${PR_HEAD_OWNER}/${repository}@$(git -C "$directory" rev-parse HEAD)\` (requested \`$ref\`)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Run
        env:
          ASSETS_TEST: ${{ matrix.test }}
        run: /entrypoint.sh test-assets "$ASSETS_TEST"
      - name: Upload pathfind reports
        if: always() && matrix.test == 'pathfind'
        uses: actions/upload-artifact@v4
        with:
          name: pathfind-reports
          path: /workspace/repos/assets/tmp/pathfind
          if-no-files-found: warn

  map-tests:
    name: Compile ${{ matrix.map }}
    needs: [resolve-toolbox, discover-maps]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        map: ${{ fromJSON(needs.discover-maps.outputs.maps) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select assets PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/assets fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/assets checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/assets rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/assets rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          {
            echo "Assets PR head: \`$PR_HEAD_SHA\`"
            echo "Tested merge commit: \`$PR_MERGE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile Map
        env:
          MAP: ${{ matrix.map }}
        run: /entrypoint.sh build-map --map "$MAP" --full
      - name: Upload compiled map
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ matrix.map }}
          path: |
            /workspace/repos/assets/common/maps/${{ matrix.map }}.bsp
            /workspace/repos/assets/common/maps/${{ matrix.map }}.nsz
          if-no-files-found: error

  assemble-assets:
    name: Assemble Assets
    needs: [resolve-toolbox, discover-maps, map-tests]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select assets PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/assets fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/assets checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/assets rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/assets rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          {
            echo "Assets PR head: \`$PR_HEAD_SHA\`"
            echo "Tested merge commit: \`$PR_MERGE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download compiled maps
        uses: actions/download-artifact@v4
        with:
          pattern: map-*
          path: /workspace/repos/assets/common/maps
          merge-multiple: true
      - name: Verify compiled maps
        env:
          MAPS: ${{ needs.discover-maps.outputs.maps }}
        run: |
          jq -r '.[]' <<< "$MAPS" | while IFS= read -r map; do
            test -s "/workspace/repos/assets/common/maps/$map.bsp"
          done
      - name: Build archives
        run: |
          /entrypoint.sh build-wads
          /entrypoint.sh build-assets
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assembled-assets-pr
          path: /workspace/repos/assets/tmp/*.zip
          if-no-files-found: error
